# ==============================================================================
# BOOZER · RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# 100% FREE TIER ($0 / MONTH) · ZERO CREDIT CARD REQUIRED
# ==============================================================================

services:
  # 1. Spring Boot 3.3 (Java 21) Modular Monolith Backend
  - type: web
    name: boozer-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore # Lowest latency to India (~45ms)
    plan: free        # 100% Free Tier ($0/mo)
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: boozer-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: boozer-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: boozer-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: boozer-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: boozer-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: BOOZER_KYC_MIN_LEGAL_AGE
        value: "21"
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=65.0"

  # 2. React + Vite Web Portal (Customer, Retailer & Admin Command Center)
  - type: web
    name: boozer-web
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://boozer-backend.onrender.com/api/v1

# 3. Primary Relational PostgreSQL 16 Database
databases:
  - name: boozer-postgres
    databaseName: boozer_db
    user: boozer_user
    region: singapore
    plan: free # 100% Free Tier ($0/mo)
    postgresMajorVersion: "16"

